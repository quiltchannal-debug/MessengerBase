# OrangeM — reverse proxy (HTTP :80 -> C++ server on 127.0.0.1:8080)
# Позже, при наличии домена, добавьте server-блок с listen 443 ssl и сертификатом Let's Encrypt.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64m;
    client_body_timeout 120s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/orangem.access.log;
    error_log  /var/log/nginx/orangem.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
